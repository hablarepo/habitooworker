[project]
name = "habitoo-worker"
version = "0.1.0"
description = "Habitoo – worker: video místnosti -> Gaussian splat (SPZ + PLY)"
requires-python = ">=3.10"
dependencies = [
  "supabase>=2.0",
  "python-dotenv>=1.0",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
